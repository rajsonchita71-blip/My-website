<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI Voice Assistant</title>
    <style>
        body {
            background-color: #050b14;
            color: #00f0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        select, button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
        .api-box {
            width: 100%;
            max-width: 600px;
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }
        input[type="password"], input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
        }
        .jarvis {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            align-self: flex-start;
        }
        .user {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-end;
            color: #fff;
        }
        .arc-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .arc-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #00f0ff;
            background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, rgba(5,11,20,1) 70%);
            box-shadow: 0 0 20px #00f0ff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .status {
            margin-top: 10px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .error-banner {
            color: #ff4a4a;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4a4a;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><div class="dot"></div> J.A.R.V.I.S.</div>
        <div class="controls">
            <button onclick="toggleKeyBox()">⚙ Key</button>
        </div>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <div class="api-box" id="apiBox">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key (AIzaSy...)">
        <button onclick="saveKey()">Save</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="msg jarvis">
            <strong>J.A.R.V.I.S.</strong><br>
            Online and ready, Sir. Tap the glowing Arc button to talk or type below.
        </div>
    </div>

    <div class="arc-container">
        <button class="arc-btn" onclick="startListening()">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>
        <div class="status" id="status">System Standby</div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        if(apiKey) {
            document.getElementById('apiBox').style.display = 'none';
        }

        function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                apiKey = key;
                document.getElementById('apiBox').style.display = 'none';
                showError("");
            }
        }

        function toggleKeyBox() {
            const box = document.getElementById('apiBox');
            box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            if(msg) {
                banner.innerText = msg;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        async function askGemini(promptText) {
            if(!apiKey) {
                showError("Please enter your Gemini API key using the ⚙ Key button.");
                return;
            }

            // Updated to the latest recommended model
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    showError(data.error.message);
                    return "Sorry Sir, I encountered an error: " + data.error.message;
                }

                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                showError("Network or Connection Error.");
                return "Sorry Sir, I couldn't connect to the server.";
            }
        }

        function addMessage(sender, text) {
            const chat = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerHTML = `<strong>${sender === 'jarvis' ? 'J.A.R.V.I.S.' : 'YOU'}</strong><br>${text}`;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported on this browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            const status = document.getElementById('status');

            recognition.onstart = () => {
                status.innerText = "Listening...";
            };

            recognition.onspeechend = () => {
                status.innerText = "Processing...";
                recognition.stop();
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                addMessage('user', transcript);
                
                const reply = await askGemini(transcript);
                addMessage('jarvis', reply);
                speak(reply);
                
                status.innerText = "System Standby";
            };

            recognition.onerror = () => {
                status.innerText = "System Standby";
            };

            recognition.start();
        }
    </script>
</body>
</html>
