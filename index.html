 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Professional AI Core</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #030a17 0%, #010308 100%);
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(56, 189, 248, 0.04);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }
        .title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
        }
        .dot {
            width: 8px; height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .controls { display: flex; gap: 6px; align-items: center; }
        select, button {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 5px 8px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        select:hover, button:hover { background: rgba(56, 189, 248, 0.2); }
        select option { background-color: #030a17; color: #38bdf8; }
        
        .icon-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-size: 0.95rem;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .api-box {
            width: 100%;
            max-width: 750px;
            margin: 8px 0;
            display: flex;
            gap: 8px;
        }
        input[type="password"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            background: rgba(2, 6, 15, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            padding: 12px;
            height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.03);
        }
        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .jarvis { background: rgba(56, 189, 248, 0.06); border: 1px solid rgba(56, 189, 248, 0.2); align-self: flex-start; color: #e0f2fe; }
        .user { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); align-self: flex-end; color: #fff; }

        .interactive-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            position: relative;
        }
        .stop-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stop-btn:hover { background: rgba(239, 68, 68, 0.3); }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .ring-outer {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 2px dashed rgba(56, 189, 248, 0.4);
            animation: spin 10s linear infinite;
        }

            position: absolute; width: 78%; height: 78%;
            border-radius: 50%; border: 2px solid rgba(56, 189, 248, 0.25);
            animation: spin-reverse 8s linear infinite;
        }
