   <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Professional AI Core</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #030a17 0%, #010308 100%);
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(56, 189, 248, 0.04);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }
        .title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
        }
        .dot {
            width: 8px; height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .controls { display: flex; gap: 6px; align-items: center; }
        select, button {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 5px 8px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        select:hover, button:hover { background: rgba(56, 189, 248, 0.2); }
        select option { background-color: #030a17; color: #38bdf8; }
