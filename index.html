   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERA BHAI - AI Voice Assistant</title>
    <style>
        body {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #38bdf8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(56, 189, 248, 0.05);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .title {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
        }
        .dot {
            width: 10px;
            height: 10px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 12px #38bdf8;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.9); } }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        select, button {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
        select option {
            background-color: #030712;
            color: #38bdf8;
        }
        .api-box {
            width: 100%;
            max-width: 600px;
            margin: 10px 0;
            display: flex;
            gap: 10px;
        }
        input[type="password"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 15px 0;
            padding-right: 5px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .shera {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            align-self: flex-start;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
            color: #e0f2fe;
        }
        .user {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-end;
            color: #fff;
        }
        
        .avatar-core {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .core-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.4);
            animation: rotateRing 10s linear infinite;
        }
        @keyframes rotateRing { 100% { transform: rotate(360deg); } }
        
        .arc-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            background: radial-gradient(circle, rgba(56,189,248,0.6) 0%, rgba(3,7,18,1) 75%);
            box-shadow: 0 0 25px #38bdf8;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: transform 0.2s;
        }
        .arc-btn:active { transform: scale(0.95); }
        
        .listening .core-ring { border-color: #f43f5e; animation: rotateRing 3s linear infinite; }
        .listening .arc-btn { box-shadow: 0 0 30px #f43f5e; border-color: #f43f5e; }
        
        .speaking .arc-btn {
            box-shadow: 0 0 45px #38bdf8, 0 0 90px rgba(56,189,248,0.6);
            transform: scale(1.08);
        }
        
        .status {
            margin-top: 5px;
            font-size: 0.8rem;
            opacity: 0.8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #38bdf8;
        }
        .error-banner {
            color: #ff4a4a;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4a4a;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><div class="dot"></div> SHERA BHAI</div>
        <div class="controls">
            <select id="langSelect">
                <option value="en-IN">English</option>
                <option value="hi-IN" selected>Hindi (हिंदी)</option>
                <option value="hinglish">Hinglish</option>
            </select>
            <button onclick="toggleKeyBox()">⚙ Key</button>
        </div>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <div class="api-box" id="apiBox">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key (AIzaSy...)">
        <button onclick="saveKey()">Save</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="msg shera">
            <strong>Shera Bhai</strong><br>
            Ram Ram bhai! Main tera Shera Bhai hoon. Bol kya madad karu teri? Mic button dabakar baat kar sakte ho.
        </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 10px;">
        <div class="avatar-core" id="avatarWrapper">
            <div class="core-ring"></div>
            <button class="arc-btn" onclick="startListening()">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
        </div>
        <div class="status" id="status">Tap to speak</div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        if(apiKey) { document.getElementById('apiBox').style.display = 'none'; }

        function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                apiKey = key;
                document.getElementById('apiBox').style.display = 'none';
                showError("");
            }
        }

        function toggleKeyBox() {
            const box = document.getElementById('apiBox');
            box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            if(msg) { banner.innerText = msg; banner.style.display = 'block'; }
            else { banner.style.display = 'none'; }
        }

        async function askGemini(promptText) {
            if(!apiKey) {
                showError("Please enter your Gemini API key using the ⚙ Key button.");
                return;
            }

            const selectedLang = document.getElementById('langSelect').value;
            let systemInstruction = "You are Shera Bhai, a cool, friendly, supportive, and street-smart Indian brotherly figure. Talk naturally like a helpful local buddy, keep responses direct, energetic, and engaging.";
            
            if (selectedLang === 'hi-IN') {
                systemInstruction += " Reply strictly in natural, friendly Hindi (Devanagari script).";
            } else if (selectedLang === 'hinglish') {
                systemInstruction += " Reply strictly in casual, friendly Indian Hinglish.";
            } else {
                systemInstruction += " Reply in warm Indian English.";
            }

            const fullPrompt = `${systemInstruction}\nUser message: ${promptText}`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: fullPrompt }] }] })
                });

                const data = await response.json();
                if (data.error) {
                    showError(data.error.message);
                    return "Bhai error aa gaya: " + data.error.message;
                }
                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                showError("Network connection error.");
                return "Net connection check kar le bhai, connect nahi ho pa raha.";
            }
        }

        function addMessage(sender, text) {
            const chat = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerHTML = `<strong>${sender === 'shera' ? 'Shera Bhai' : 'YOU'}</strong><br>${text}`;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            const wrapper = document.getElementById('avatarWrapper');
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedLang = document.getElementById('langSelect').value;
            
            utterance.lang = selectedLang === 'hi-IN' ? 'hi-IN' : 'en-IN';
            utterance.pitch = 0.9; // Thodi heavy aur solid aawaz ke liye
            utterance.rate = 1.0;  // Normal clear speed
            
            utterance.onstart = () => {
                wrapper.classList.add('speaking');
                document.getElementById('status').innerText = "Shera bol raha hai...";
            };

            utterance.onend = () => {
                wrapper.classList.remove('speaking');
                document.getElementById('status').innerText = "Tap to speak";
            };

            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported.");
                return;
            }

            const recognition = new SpeechRecognition();
            const status = document.getElementById('status');
            const wrapper = document.getElementById('avatarWrapper');
            const selectedLang = document.getElementById('langSelect').value;
            
            recognition.lang = selectedLang === 'hi-IN' ? 'hi-IN' : 'en-IN';

            recognition.onstart = () => {
                wrapper.classList.add('listening');
                status.innerText = "Sun raha hu...";
            };

            recognition.onspeechend = () => {
                wrapper.classList.remove('listening');
                status.innerText = "Soch raha hu...";
                recognition.stop();
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                addMessage('user', transcript);
                
                const reply = await askGemini(transcript);
                addMessage('shera', reply);
                speak(reply);
            };

            recognition.onerror = () => {
                wrapper.classList.remove('listening');
                status.innerText = "Tap to speak";
            };

            recognition.start();
        }
    </script>
</body>
</html>
